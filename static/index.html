<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maichart Index</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-glow"></div>
    <div class="container">
        <header>
            <h1>Maichart Index</h1>
            <p>从采音搜索官谱配置</p>
        </header>

        <main>
            <div class="search-box">
                <input type="text" id="queryInput" placeholder="输入 Simai 格式的采音 (e.g., {8}1*,1,1,)" autocomplete="off">
                <button id="searchBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    搜索
                </button>
            </div>

            <details class="help-card">
                <summary>如何使用搜索？</summary>
                <div class="help-content">
                    <p>输入 Simai 格式的采音以搜索匹配的模式。</p>
                    <ul>
                        <li><strong>复合节奏:</strong> <code>{8}1,1,1,{12}1,1,1,{16}1,1,1,</code></li>
                        <li><strong>星星:</strong> <code>{8}1*,1,1*,1,1*,1,1*,1,</code></li>
                    </ul>
                    <p class="tip"><strong>注意：</strong> 键位数字会被忽略，只匹配节奏。</p>
                </div>
            </details>

            <div class="filters">
                <div class="filter-group">
                    <label>定数范围</label>
                    <div class="range-inputs">
                        <input type="number" id="levelMin" placeholder="Min" step="0.1">
                        <span>-</span>
                        <input type="number" id="levelMax" placeholder="Max" step="0.1">
                    </div>
                </div>
                <div class="filter-group">
                    <label>BPM 范围</label>
                    <div class="range-inputs">
                        <input type="number" id="bpmMin" placeholder="Min" step="1">
                        <span>-</span>
                        <input type="number" id="bpmMax" placeholder="Max" step="1">
                    </div>
                </div>
                <div class="filter-group">
                    <label>谱师</label>
                    <input type="text" id="designerInput" placeholder="谱师">
                </div>
                <!-- Difficulty Toggles -->
                <div class="filter-group full-width">
                    <label>难度</label>
                    <div class="diff-toggles" id="diffToggles">
                        <button class="diff-btn" data-val="Expert">Expert</button>
                        <button class="diff-btn" data-val="Master">Master</button>
                        <button class="diff-btn" data-val="ReMaster">Re:Master</button>
                        <button class="diff-btn" data-val="Advanced">Advanced</button>
                        <button class="diff-btn" data-val="Basic">Basic</button>
                        <button class="diff-btn" data-val="Easy">Easy</button>
                    </div>
                </div>
            </div>

            <div class="results-info" id="resultsInfo" style="display: none;">
                找到 <span id="matchCount">0</span> 个结果
            </div>

            <div id="resultsGrid" class="results-grid">
                <!-- Results will be injected here -->
            </div>

            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div> 搜索中...
            </div>
        </main>

        <footer>
            <div class="footer-content">
                <a href="https://github.com/Choimoe/MaichartIndex" target="_blank" rel="noopener noreferrer"
                    class="footer-link">
                    <svg height="20" width="20" viewBox="0 0 16 16" fill="currentColor">
                        <path
                            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z">
                        </path>
                    </svg>
                    GitHub
                </a>
                <span class="divider">|</span>
                <span>Made by <a href="https://github.com/Choimoe" target="_blank"
                        rel="noopener noreferrer">Choimoe</a></span>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>

</html>
