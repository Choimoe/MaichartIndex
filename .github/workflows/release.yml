name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pyinstaller
        # If requirements.txt exists, install it too (though we list key deps above just in case)
        # pip install -r requirements.txt
        
    - name: Build with PyInstaller
      run: |
        # Build main.py into a single executable 'maichart-index.exe'
        # Include static directory to 'static'
        pyinstaller --onefile --name maichart-index --add-data "static;static" main.py
        
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false
        
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/maichart-index.exe
        asset_name: maichart-index.exe
        asset_content_type: application/vnd.microsoft.portable-executable
