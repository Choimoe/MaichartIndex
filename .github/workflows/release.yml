name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-tools:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            sep: ';'
            exe_ext: '.exe'
            suffix: 'Windows'
            asset_ext: '.zip'
          - os: ubuntu-latest
            sep: ':'
            exe_ext: ''
            suffix: 'Linux'
            asset_ext: '.tar.gz'
          - os: macos-latest
            sep: ':'
            exe_ext: ''
            suffix: 'macOS'
            asset_ext: '.tar.gz'
            
    permissions:
      contents: write
      packages: write
      
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' 
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pyinstaller
        
    - name: Build Tools
      run: |
        # Build Client (CLI)
        pyinstaller --onefile --name maichart-cli --add-data "static${{ matrix.sep }}static" main.py
        
        # Build Web (Server)
        pyinstaller --onefile --name maichart-webui --add-data "static${{ matrix.sep }}static" server.py
        
    - name: Organize Artifacts
      shell: bash
      run: |
        TAG="${{ github.ref_name }}"
        ROOT="MaichartIndex-Tools-${{ matrix.suffix }}-$TAG"
        
        mkdir -p "$ROOT"
        
        cp "dist/maichart-cli${{ matrix.exe_ext }}" "$ROOT/"
        cp "dist/maichart-webui${{ matrix.exe_ext }}" "$ROOT/"
        
        if [ "${{ matrix.asset_ext }}" == ".zip" ]; then
            # Windows (using PowerShell to zip if on windows, or zip cmd)
            # Actually standard runners have 'zip' or we can use pwsh
            # Let's simple check OS or just rely on '7z' or 'zip' generally avail?
            # Safer to use python to zip/tar to be cross-platform or use specific shell commands
            if [ "${{ runner.os }}" == "Windows" ]; then
                7z a "${ROOT}.zip" "$ROOT"
            else
                zip -r "${ROOT}.zip" "$ROOT"
            fi
        else
            # Linux/Mac
            tar -czvf "${ROOT}.tar.gz" "$ROOT"
        fi
        
    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: MaichartIndex-Tools-${{ matrix.suffix }}-${{ github.ref_name }}${{ matrix.asset_ext }}
    
  build-db:
    runs-on: windows-latest
    permissions:
      contents: write
    
    env:
      PYTHONUTF8: 1
      
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        
    - name: Build Database
      run: |
        # data folder should be present from checkout
        python main.py build
        
    - name: Compress Database
      shell: pwsh
      run: |
        $TAG = "${{ github.ref_name }}"
        $DB_ZIP = "MaichartIndex-Database-$TAG.zip"
        Compress-Archive -Path "maichart.db" -DestinationPath $DB_ZIP
        
    - name: Upload Database to Release
      uses: softprops/action-gh-release@v1
      with:
        files: MaichartIndex-Database-${{ github.ref_name }}.zip
