name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-tools:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write
      
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' 
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pyinstaller
        
    - name: Build Tools
      run: |
        # Build Client (CLI)
        # Assuming main.py can run as client. Name it maichart-cli.exe
        pyinstaller --onefile --name maichart-cli main.py
        
        # Build Web (Server)
        # Name it maichart-web.exe, include static files
        pyinstaller --onefile --name maichart-web --add-data "static;static" server.py
        
    - name: Organize Artifacts
      shell: pwsh
      run: |
        $TAG = "${{ github.ref_name }}"
        $ROOT = "MaichartIndex-Tools-$TAG"
        
        New-Item -ItemType Directory -Path "$ROOT\Client" -Force
        New-Item -ItemType Directory -Path "$ROOT\Web" -Force
        
        Copy-Item "dist\maichart-cli.exe" -Destination "$ROOT\Client\"
        Copy-Item "dist\maichart-web.exe" -Destination "$ROOT\Web\"
        
        # Compress
        Compress-Archive -Path "$ROOT" -DestinationPath "$ROOT.zip"
        
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        files: MaichartIndex-Tools-${{ github.ref_name }}.zip
    
  build-db:
    runs-on: windows-latest
    needs: build-tools # Optional: Run independent? Maybe safer to run parallel. Removed needs.
    permissions:
      contents: write
      
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        
    - name: Build Database
      run: |
        # data folder should be present from checkout
        python main.py build
        
    - name: Compress Database
      shell: pwsh
      run: |
        $TAG = "${{ github.ref_name }}"
        $DB_ZIP = "MaichartIndex-Database-$TAG.zip"
        Compress-Archive -Path "maichart.db" -DestinationPath $DB_ZIP
        
    - name: Upload Database to Release
      uses: softprops/action-gh-release@v1
      with:
        files: MaichartIndex-Database-${{ github.ref_name }}.zip
